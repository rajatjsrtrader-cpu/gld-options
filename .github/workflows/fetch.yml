name: fetch-gld

# One job per trading day that keeps running through the whole US options session and refreshes the data every 5 minutes.
# Fresh data goes to a separate "data" branch (read by the page from raw.githubusercontent.com), so GitHub Pages does not
# have to rebuild every 5 minutes. The page itself is published to gh-pages once, when the job starts.
# The two schedules cover summer and winter time. The second start picks up when the first one hits GitHub's 6 hour limit.
on:
  schedule:
    - cron: "10 13 * * 1-5"
    - cron: "50 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: gld-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and publish every 5 minutes until the session ends
        run: |
          INTERVAL="${GLD_INTERVAL:-300}"
          REMOTE="${GLD_REMOTE:-https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git}"
          mkdir -p site/data datapub
          start=$(date +%s)
          first=1
          # The previous data file is the only memory between runs (volume history and yesterday's open interest).
          echo "{}" > prev.json
          git fetch --depth 1 origin data:refs/remotes/origin/data 2>/dev/null && git show origin/data:latest.json > prev.json 2>/dev/null \
            || { git fetch --depth 1 origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null && git show origin/gh-pages:data/latest.json > prev.json 2>/dev/null; } \
            || echo "{}" > prev.json
          push_dir() {  # $1 = folder, $2 = branch: force-push one fresh commit so the repository never grows
            (
              cd "$1"
              rm -rf .git
              git init -q -b "$2"
              git config user.name "gld-bot"
              git config user.email "gld-bot@users.noreply.github.com"
              git add -A
              git commit -q -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git push -q -f "$REMOTE" "$2"
            ) || echo "publish to $2 failed this round"
          }
          while true; do
            t0=$(date +%s)
            if python scripts/fetch_gld.py --prev prev.json --out datapub/latest.json; then
              cp datapub/latest.json prev.json
              push_dir datapub data
              if [ "$first" = 1 ]; then
                first=0
                cp datapub/latest.json site/data/latest.json
                cp index.html site/index.html
                touch site/.nojekyll
                push_dir site gh-pages
              fi
            else
              echo "fetch failed this round, keeping the previous data"
            fi
            python scripts/fetch_gld.py --check-session || { echo "session over"; break; }
            [ $(( $(date +%s) - start )) -gt 20700 ] && { echo "time limit, the next scheduled start continues"; break; }
            used=$(( $(date +%s) - t0 ))
            [ "$used" -lt "$INTERVAL" ] && sleep $(( INTERVAL - used ))
          done
