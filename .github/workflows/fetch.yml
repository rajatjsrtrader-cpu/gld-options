name: fetch-gld

# One job per trading day that keeps running through the whole US options session and refreshes the data every 5 minutes.
# (Plain "every 15 minutes" schedules are often delayed or skipped by GitHub, so the job does its own timing.)
# The two schedules cover summer and winter time. A second start picks up when the first one hits GitHub's 6 hour limit.
on:
  schedule:
    - cron: "10 13 * * 1-5"
    - cron: "50 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: gld-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and publish every 5 minutes until the session ends
        run: |
          INTERVAL="${GLD_INTERVAL:-300}"
          REMOTE="${GLD_REMOTE:-https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git}"
          mkdir -p site/data
          start=$(date +%s)
          # The previous data file is the only memory between runs (volume history and yesterday's open interest).
          if git fetch --depth 1 origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            git show origin/gh-pages:data/latest.json > prev.json 2>/dev/null || echo "{}" > prev.json
          else
            echo "{}" > prev.json
          fi
          while true; do
            t0=$(date +%s)
            if python scripts/fetch_gld.py --prev prev.json --out site/data/new.json; then
              mv site/data/new.json site/data/latest.json
              cp site/data/latest.json prev.json
              cp index.html site/index.html
              touch site/.nojekyll
              # Force-push one fresh commit so the repository never grows.
              (
                cd site
                rm -rf .git
                git init -q -b gh-pages
                git config user.name "gld-bot"
                git config user.email "gld-bot@users.noreply.github.com"
                git add -A
                git commit -q -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                git push -q -f "$REMOTE" gh-pages
              ) || echo "publish failed this round"
            else
              echo "fetch failed this round, keeping the previous data"
            fi
            python scripts/fetch_gld.py --check-session || { echo "session over"; break; }
            [ $(( $(date +%s) - start )) -gt 20700 ] && { echo "time limit, the next scheduled start continues"; break; }
            used=$(( $(date +%s) - t0 ))
            [ "$used" -lt "$INTERVAL" ] && sleep $(( INTERVAL - used ))
          done
