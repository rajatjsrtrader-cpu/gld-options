
name: .github/workflows/fetch.yml

# Runs every 15 minutes, Mon-Fri, from 12:00 to 21:59 UTC. That covers the US options session in both summer and winter time.
# GitHub can start scheduled runs a few minutes late, and occasionally skips one. The page shows how old the data is.
on:
  schedule:
    - cron: "*/15 12-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: gld-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The previous data file is the only memory between runs (volume history and yesterday's open interest).
      - name: Get previous data
        run: |
          if git fetch --depth 1 origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            git show origin/gh-pages:data/latest.json > prev.json 2>/dev/null || echo "{}" > prev.json
          else
            echo "{}" > prev.json
          fi

      - name: Fetch GLD options
        run: |
          mkdir -p site/data
          python scripts/fetch_gld.py --prev prev.json --out site/data/latest.json

      - name: Build site
        run: |
          cp index.html site/index.html
          touch site/.nojekyll

      # Force-push a single fresh commit to the gh-pages branch each run, so the repository never grows.
      - name: Publish
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "gld-bot"
          git config user.email "gld-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
